connectors:
  esp32:
    pins: [GPIO18, GPIO34, 3V3, GND]

  usb_power:
    pins: [5V, GND]

  servo_pan:
    pins: [signal, vcc, gnd]

  potentiometer:
    pins: [vcc, signal, gnd]
    value: 10k

  capacitor:
    pins: [pos, neg]
    value: 470uF

connections:
  # Servo control signal
  - esp32.GPIO18: servo_pan.signal

  # Potentiometer → ESP32 ADC
  - potentiometer.signal: esp32.GPIO34
  - esp32.3V3: potentiometer.vcc
  - esp32.GND: potentiometer.gnd

  # Servo power
  - usb_power.5V: servo_pan.vcc
  - usb_power.5V: capacitor.pos

  # Ground (common ground required)
  - usb_power.GND: servo_pan.gnd
  - usb_power.GND: capacitor.neg
  - usb_power.GND: esp32.GND